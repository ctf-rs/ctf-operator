apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: jeopardy.operator.ctf.rs
spec:
  group: operator.ctf.rs
  names:
    categories: []
    kind: Jeopardy
    plural: jeopardy
    shortNames:
    - jeopardy
    singular: jeopardy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.fullName
      name: FULL NAME
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Custom resource representing a Jeopardy CTF
        properties:
          spec:
            properties:
              description:
                nullable: true
                type: string
              expose:
                properties:
                  reservation:
                    properties:
                      end:
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                      start:
                        format: uint16
                        maximum: 65535.0
                        minimum: 0.0
                        type: integer
                    required:
                    - end
                    - start
                    type: object
                  serviceTemplate:
                    default:
                      annotations: {}
                      labels: {}
                      type: ClusterIP
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        default: {}
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        default: {}
                        type: object
                      type:
                        default: ClusterIP
                        enum:
                        - ClusterIP
                        - NodePort
                        - LoadBalancer
                        type: string
                    type: object
                required:
                - reservation
                type: object
              flag:
                properties:
                  format:
                    default: curly
                    enum:
                    - curly
                    - round
                    - square
                    - angle
                    - underscore
                    type: string
                  prefix:
                    default: ''
                    type: string
                  random:
                    nullable: true
                    properties:
                      concat:
                        maxLength: 1
                        minLength: 1
                        nullable: true
                        type: string
                      digits:
                        default: true
                        type: boolean
                      len:
                        default: 8
                        format: uint8
                        maximum: 255.0
                        minimum: 0.0
                        type: integer
                      lower:
                        default: true
                        type: boolean
                      special:
                        default: ''
                        type: string
                      upper:
                        default: true
                        type: boolean
                    type: object
                type: object
              fullName:
                default: ''
                type: string
            required:
            - expose
            - flag
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    lastProbeTime:
                      description: Last time an KubeObject was probed for a condition.
                      format: date-time
                      nullable: true
                      type: string
                    lastTransitionTime:
                      description: Last time a condition transitioned from one status to another.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      description: Human readable message that describes details about last transition.
                      nullable: true
                      type: string
                    reason:
                      description: |-
                        Unique one word reason in CamelCase that describes the reason for a
                        transition.
                      nullable: true
                      type: string
                    status:
                      description: |-
                        Status of the condition.
                        Can be True, False, Unknown
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: Type of the condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: JeopardyValidated
        type: object
        x-kubernetes-validations:
        - message: fullName is empty
          rule: self.spec.fullName != ''
        - message: Flag prefix is empty
          rule: self.spec.flag.prefix != ''
        - message: Flag prefix can only contain letters and numbers
          rule: self.spec.flag.prefix.matches('^[a-zA-Z0-9]+$')
        - message: Flag prefix must be between 3 and 6 characters long
          rule: size(self.spec.flag.prefix) >= 3 && size(self.spec.flag.prefix) <= 6
        - message: Flag random len must be non-zero
          rule: '!has(self.spec.flag.random) || self.spec.flag.random.len != 0'
        - message: Flag random cant be larger than 64
          rule: '!has(self.spec.flag.random) || self.spec.flag.random.len < 64'
        - message: Flag random cant be larger than 64
          rule: '!has(self.spec.flag.random) || self.spec.flag.random.len < 64'
        - message: Service reservation start be larger or equal than 1024
          rule: self.spec.expose.reservation.start >= 1024
        - message: Service reservation end be smaller or equal than 49151
          rule: self.spec.expose.reservation.end <= 49151
        - message: Service reservation start must be smaller or equal than end
          rule: self.spec.expose.reservation.start <= self.spec.expose.reservation.end
    served: true
    storage: true
    subresources:
      status: {}
