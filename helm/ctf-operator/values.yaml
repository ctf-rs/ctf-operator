replicaCount: 1

image:
  repository: registry.ctf.rs/ctf/operator
  tag: edge
  pullPolicy: IfNotPresent

imagePullSecrets: []
  # Example:
  # - name: ctf-registry-pull-secret

nameOverride: ""
fullnameOverride: ""

watchNamespaces:
  - ctf

instanceNamespacePrefix: ctf-inst-

registry: []
  # Example:
  # - endpoint: registry.ctf.rs/ctf
  #   secretRef:
  #     name: ctf-registry-creds
  #     usernameKey: username
  #     passwordKey: password

storage:
  s3: []
    # Example:
    # - endpoint: https://s3.ctf.rs
    #   bucket: ctf-bucket
    #   region: us-east-1
    #   pathStyle: true
    #   prefix: challenges
    #   secretRef:
    #     name: ctf-storage-creds
    #     accessKeyIdKey: accessKeyId
    #     secretAccessKeyKey: secretAccessKey

instance:
  deployment:
    replicas: 1
    imagePullPolicy: ""
  service:
    type: ClusterIP
    nodePortMode: Auto

crds:
  install: true

serviceAccount:
  create: true
  name: ""
  annotations: {}

env: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

rbac:
  create: true
