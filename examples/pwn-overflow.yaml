name: pwn-overflow
fullName: Buffer Overflow Basics
description: |
  A simple C program reads user input without bounds checking.
  Overflow the buffer to overwrite the return address and
  redirect execution to the win function that prints the flag.
authors:
  - CTF Team
categories:
  - pwn
difficulty: veryeasy
tags:
  - buffer-overflow
  - stack
  - beginner
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
