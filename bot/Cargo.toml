[package]
name = "bot"
version = "0.1.0"
edition = "2024"
description = "Discord bot for CTF platform — account linking, help desk tickets"
license = "MIT"
repository = "https://github.com/scc2026/ctf-operator"
readme = "../README.md"
keywords = ["ctf", "discord", "bot"]
categories = ["command-line-utilities"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "cache",
    "rustls_backend",
] }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["runtime-tokio", "postgres"] }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
