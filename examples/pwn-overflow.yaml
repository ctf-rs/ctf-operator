apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: pwn-overflow
spec:
  fullName: Buffer Overflow Basics
  instancing: true
  description: 'A simple C program reads user input without bounds checking.

    Overflow the buffer to overwrite the return address and

    redirect execution to the win function that prints the flag.

    '
  authors:
  - CTF Team
  categories:
  - pwn
  difficulty: veryeasy
  tags:
  - buffer-overflow
  - stack
  - beginner
  flags:
  - name: flag1
    label: "Part 1"
    body: fooflag1
    difficulty: veryeasy
  - name: flag2
    label: "Part 2"
    body: fooflag2
    difficulty: veryeasy
  - name: flag3
    label: "Part 3"
    body: fooflag3
    difficulty: easy
  - name: flag4
    label: "Part 4"
    body: fooflag4
    difficulty: mid
    random:
      len: 8
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag1
      env: FLAG1
    - name: flag2
      env: FLAG2
    - name: flag3
      env: FLAG3
    - name: flag4
      env: FLAG4
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
