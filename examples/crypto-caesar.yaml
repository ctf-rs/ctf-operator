apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: crypto-caesar
spec:
  fullName: Caesar Cipher
  instancing: false
  description: 'The ancient Romans knew a thing or two about secret messages.

    A flag has been encrypted using a simple substitution cipher.

    Crack the Caesar cipher to recover the original plaintext flag.

    '
  authors:
  - CTF Team
  categories:
  - crypto
  tags:
  - classical
  - substitution
  - beginner
  flags:
  - name: flag
    label: "Decrypt the message"
    body: fake_flag_value
    difficulty: veryeasy
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
