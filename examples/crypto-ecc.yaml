apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: crypto-ecc
spec:
  fullName: Elliptic Curve Cryptography
  instancing: false
  description: 'A custom elliptic curve implementation uses non-standard parameters.

    The curve order has a smooth factor that makes it vulnerable to

    Pohlig-Hellman attack. Solve the discrete log to recover the flag.

    '
  authors:
  - CTF Team
  categories:
  - crypto
  tags:
  - ecc
  - discrete-log
  - pohlig-hellman
  flags:
  - name: flag
    label: "Decrypt the message"
    body: fake_flag_value
    difficulty: hard
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
