apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: web-xss
spec:
  fullName: XSS Playground
  description: 'A social media platform has a vulnerability in its comment section.

    Craft a payload to exploit the cross-site scripting flaw and

    steal the admin''s session cookie to retrieve the flag.

    '
  authors:
  - CTF Team
  categories:
  - web
  difficulty: mid
  tags:
  - xss
  - javascript
  - cookies
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
