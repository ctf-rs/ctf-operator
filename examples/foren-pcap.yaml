apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: foren-pcap
spec:
  fullName: Packet Capture Analysis
  instancing: false
  description: 'We captured network traffic from a suspicious host on our network.

    Analyze the PCAP file to find credentials being transmitted in

    cleartext and use them to recover the flag.

    '
  authors:
  - CTF Team
  categories:
  - foren
  tags:
  - pcap
  - wireshark
  - network
  flags:
  - name: flag
    label: "Analyze the evidence"
    body: fake_flag_value
    difficulty: veryeasy
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
