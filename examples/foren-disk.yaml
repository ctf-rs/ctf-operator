name: foren-disk
fullName: Disk Forensics
description: |
  A disk image from a compromised workstation has been provided.
  Recover deleted files and analyze the filesystem metadata
  to find the flag hidden by the attacker.
authors:
  - CTF Team
categories:
  - foren
difficulty: easy
tags:
  - disk-image
  - file-recovery
  - ext4
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
