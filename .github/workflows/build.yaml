name: Build Image (Buildah)
on: [push]

jobs:
  build:
    runs-on: github-actions-ctf-rs

    container:
      image: quay.io/buildah/stable

    steps:
      - uses: actions/checkout@v4

      - name: Build image with Buildah
        uses: redhat-actions/buildah-build@v2
        with:
          image: my-new-image
          tags: v1,${{ github.sha }}
          containerfiles: |
            ./Dockerfile
          context: .
