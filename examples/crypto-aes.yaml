apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: crypto-aes
spec:
  fullName: AES Challenge
  instancing: false
  description: 'An encryption oracle allows you to encrypt arbitrary plaintexts using
    AES-CBC.

    The initialization vector is reused across sessions. Exploit this weakness

    to perform a chosen-plaintext attack and recover the secret flag.

    '
  authors:
  - CTF Team
  categories:
  - crypto
  difficulty: mid
  tags:
  - aes
  - cbc
  - chosen-plaintext
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
