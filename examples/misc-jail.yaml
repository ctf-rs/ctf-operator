name: misc-jail
fullName: Python Jail
description: |
  You have access to a restricted Python interpreter that blocks most
  builtins and imports. Escape the sandbox by finding creative ways
  to access forbidden functions and read the flag from the filesystem.
authors:
  - CTF Team
categories:
  - misc
difficulty: mid
tags:
  - python
  - sandbox-escape
  - jail
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
