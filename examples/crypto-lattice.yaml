apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: crypto-lattice
spec:
  fullName: Lattice Based Crypto
  instancing: false
  description: 'A post-quantum cryptographic scheme based on the Learning With Errors
    problem

    has been implemented with insufficient noise. Use lattice reduction techniques

    such as LLL or BKZ to break the encryption and recover the flag.

    '
  authors:
  - CTF Team
  categories:
  - crypto
  tags:
  - lattice
  - lwe
  - post-quantum
  flags:
  - name: flag
    label: "Decrypt the message"
    body: fake_flag_value
    difficulty: insane
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
