apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: foren-stego
spec:
  fullName: Steganography
  instancing: false
  description: 'An innocent-looking image was posted on a forum by a known threat
    actor.

    The flag has been hidden within the image using advanced steganographic

    techniques. Analyze the pixel data and metadata to extract the hidden message.

    '
  authors:
  - CTF Team
  categories:
  - foren
  difficulty: hard
  tags:
  - steganography
  - image-analysis
  - hidden-data
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
