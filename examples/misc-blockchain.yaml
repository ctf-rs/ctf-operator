name: misc-blockchain
fullName: Blockchain
description: |
  A vulnerable smart contract has been deployed on a local testnet.
  Analyze the Solidity source code to find the reentrancy vulnerability
  and drain the contract's funds to trigger the flag release mechanism.
authors:
  - CTF Team
categories:
  - misc
  - crypto
difficulty: hard
tags:
  - blockchain
  - solidity
  - smart-contract
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
