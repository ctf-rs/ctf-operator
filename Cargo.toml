[workspace]
resolver = "2"
members = ["app","cli", "operator"]

[[workspace.metadata.leptos]]
name = "app"
bin-package = "app"
lib-package = "app"
output-name = "app"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:8090"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
env = "DEV"

[workspace.dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
axum = "0.8.8"
axum-extra = "0.12.5"
aws-config = "1.8.8"
aws-credential-types = "1.2.8"
aws-sdk-s3 = "1.81.0"
base64 = "0.22.1"
clap = "4.5.60"
futures = "0.3.32"
garde = "0.22.1"
http = "1.3.1"
jiff = "0.2.23"
k8s-openapi = { version = "0.27.1", features = ["schemars", "v1_33"] }
kube = "3.0.1"
leptos = "0.8.17"
once_cell = "1.21.3"
parking_lot = "0.12.5"
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "form"] }
rustls = { version = "0.23.36", default-features = false }
schemars = "1.2.1"
serde = "1.0.228"
serde-saphyr = "0.0.21"
serde_json = "1.0.149"
sqlx = "0.8.6"
thiserror = "2.0.18"
tokio = "1.50.0"
tokio-stream = "0.1.17"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
url = "2.5.7"
urlencoding = "2.1.3"
uuid = "1.18.1"
wasm-bindgen = "0.2"
