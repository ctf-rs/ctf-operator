                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: CtfValidated
        type: object
        x-kubernetes-validations:
        - message: fullName is empty
          rule: self.spec.fullName != ''
        - message: at least one challenge reference is required
          rule: size(self.spec.challenges) > 0
        - message: challenge reference name is required
          rule: self.spec.challenges.all(ch, ch != '')
        - message: flag prefix is empty
          rule: self.spec.flag.prefix != ''
        - message: flag prefix must be alphanumeric
          rule: self.spec.flag.prefix.matches('^[a-zA-Z0-9]+$')
        - message: flag prefix must be between 3 and 6 characters
          rule: size(self.spec.flag.prefix) >= 3 && size(self.spec.flag.prefix) <= 6
        - message: network.ports.start must be >= 1024
          rule: self.spec.network.ports.start >= 1024
        - message: network.ports.end must be <= 49151
          rule: self.spec.network.ports.end <= 49151
        - message: network.ports.start must be <= network.ports.end
          rule: self.spec.network.ports.start <= self.spec.network.ports.end
