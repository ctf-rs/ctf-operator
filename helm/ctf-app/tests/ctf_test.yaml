suite: ctf resource rendering
templates:
  - templates/ctf.yaml
tests:
  - it: does not render Ctf when install is false
    set:
      ctf:
        name: my-ctf
        install: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders Ctf resource when install is true
    set:
      ctf:
        name: my-ctf
        namespace: ctf
        install: true
        fullName: "My CTF 2026"
        public: true
        instanceDurationSeconds: 1800
        challenges:
          - web-sqli
          - crypto-rsa
        flag:
          prefix: CTF
          format: curly
          random:
            length: 12
        network:
          ip: 10.0.42.1
          ports:
            start: 12000
            end: 13000
    asserts:
      - isKind:
          of: Ctf
      - equal:
          path: metadata.name
          value: my-ctf
      - equal:
          path: metadata.namespace
          value: ctf
      - equal:
          path: spec.fullName
          value: "My CTF 2026"
      - equal:
          path: spec.public
          value: true
      - equal:
          path: spec.instanceDurationSeconds
          value: 1800
      - contains:
          path: spec.challenges
          content: "web-sqli"
      - contains:
          path: spec.challenges
          content: "crypto-rsa"
      - equal:
          path: spec.flag.prefix
          value: "CTF"
      - equal:
          path: spec.flag.format
          value: "curly"
      - equal:
          path: spec.flag.random.length
          value: 12
      - equal:
          path: spec.network.ip
          value: "10.0.42.1"
      - equal:
          path: spec.network.ports.start
          value: 12000
      - equal:
          path: spec.network.ports.end
          value: 13000

  - it: uses default namespace when not specified
    set:
      ctf:
        name: my-ctf
        install: true
        fullName: "Test CTF"
        challenges:
          - ch1
        flag:
          prefix: CTF
        network:
          ports:
            start: 12000
            end: 13000
    asserts:
      - equal:
          path: metadata.namespace
          value: ctf

  - it: renders flag options
    set:
      ctf:
        name: my-ctf
        install: true
        fullName: "Test CTF"
        challenges:
          - ch1
        flag:
          prefix: CTF
          options:
            ignoreRandom: true
        network:
          ports:
            start: 12000
            end: 13000
    asserts:
      - equal:
          path: spec.flag.options.ignoreRandom
          value: true

  - it: omits network ip when not set
    set:
      ctf:
        name: my-ctf
        install: true
        fullName: "Test CTF"
        challenges:
          - ch1
        flag:
          prefix: CTF
        network:
          ports:
            start: 12000
            end: 13000
    asserts:
      - isNull:
          path: spec.network.ip

  - it: renders scoreboard section
    set:
      ctf:
        name: my-ctf
        install: true
        fullName: "Test CTF"
        challenges:
          - ch1
        flag:
          prefix: CTF
        network:
          ports:
            start: 12000
            end: 13000
        scoreboard:
          visible: true
          frozen: false
    asserts:
      - equal:
          path: spec.scoreboard.visible
          value: true
      - equal:
          path: spec.scoreboard.frozen
          value: false

  - it: renders schedule section
    set:
      ctf:
        name: my-ctf
        install: true
        fullName: "Test CTF"
        challenges:
          - ch1
        flag:
          prefix: CTF
        network:
          ports:
            start: 12000
            end: 13000
        schedule:
          open: true
          openTime: "2026-06-01T00:00:00Z"
          endTime: "2026-06-02T00:00:00Z"
    asserts:
      - equal:
          path: spec.schedule.open
          value: true
      - equal:
          path: spec.schedule.openTime
          value: "2026-06-01T00:00:00Z"
      - equal:
          path: spec.schedule.endTime
          value: "2026-06-02T00:00:00Z"

  - it: omits scoreboard when empty
    set:
      ctf:
        name: my-ctf
        install: true
        fullName: "Test CTF"
        challenges:
          - ch1
        flag:
          prefix: CTF
        network:
          ports:
            start: 12000
            end: 13000
        scoreboard: {}
    asserts:
      - isNull:
          path: spec.scoreboard
