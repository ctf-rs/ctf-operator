suite: configmap rendering
templates:
  - templates/configmap.yaml
tests:
  - it: renders per-endpoint registry and per-bucket s3 configs into config.yaml
    set:
      registry:
        - endpoint: registry.ctf.rs/ctf
          secretRef:
            name: ctf-registry-creds
            usernameKey: username
            passwordKey: password
      storage:
        s3:
          - endpoint: https://s3-a.ctf.rs
            bucket: ctf-bucket-a
            region: us-east-1
            pathStyle: true
            prefix: challenges-a
            secretRef:
              name: ctf-storage-a-creds
              accessKeyIdKey: accessKeyId
              secretAccessKeyKey: secretAccessKey
      instance:
        deployment:
          replicas: 2
          imagePullPolicy: IfNotPresent
        service:
          type: NodePort
          nodePortMode: Allocated
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: RELEASE-NAME-ctf-operator-config
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?s)registry:\n\s+- endpoint: registry\.ctf\.rs/ctf'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?s)storage:\n\s+s3:\n\s+- bucket: ctf-bucket-a'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?s)secretRef:\n\s+accessKeyIdKey: accessKeyId\n\s+name: ctf-storage-a-creds\n\s+secretAccessKeyKey: secretAccessKey'
      - matchRegex:
          path: data["config.yaml"]
          pattern: '(?s)instance:\n\s+deployment:\n\s+replicas: 2\n\s+imagePullPolicy: "IfNotPresent"\n\s+service:\n\s+type: "NodePort"\n\s+nodePortMode: "Allocated"'
