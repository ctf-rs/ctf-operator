name: Build Image (Docker)
on: [push]

jobs:
  build:
    runs-on: github-actions-ctf-rs

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=registry.ctf.rs/docker-hub/moby/buildkit:master
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["registry.ctf.rs/docker-hub"]

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: |
            registry.ctf.rs/ctf/operator:latest
            registry.ctf.rs/ctf/operator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Read Harbor creds from Vault
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: http://vault.vault:8200
          method: kubernetes
          kubernetesTokenPath: /var/run/secrets/vault/token
          role: arc-github-actions-ctf-rs-runner
          secrets: |
            harbor/creds/github-actions-ctf-rs robot_account_name | HARBOR_USER ;
            harbor/creds/github-actions-ctf-rs robot_account_secret | HARBOR_PASS

      - name: Login to registry.ctf.rs
        uses: docker/login-action@v3
        with:
          registry: registry.ctf.rs
          username: ${{ steps.vault.outputs.HARBOR_USER }}
          password: ${{ steps.vault.outputs.HARBOR_PASS }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            registry.ctf.rs/ctf/operator:latest
            registry.ctf.rs/ctf/operator:${{ github.sha }}
          cache-from: type=gha
