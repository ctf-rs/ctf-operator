                default: false
                type: boolean
              network:
                properties:
                  ip:
                    format: ip
                    nullable: true
                    type: string
                  ports:
                    properties:
                      end:
                        format: uint16
                        maximum: 49151.0
                        minimum: 0.0
                        type: integer
                      start:
                        format: uint16
                        maximum: 65535.0
                        minimum: 1024.0
                        type: integer
                    required:
                    - end
                    - start
                    type: object
                required:
                - ports
                type: object
            required:
            - challenges
            - flag
            - fullName
            - network
            type: object
          status:
