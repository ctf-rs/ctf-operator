suite: deployment rendering
templates:
  - templates/deployment.yaml
tests:
  - it: uses registry.ctf.rs image repository by default
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: registry.ctf.rs/ctf/operator:0.1.0

  - it: renders operator args with all watch namespaces and instance namespace prefix
    set:
      watchNamespaces:
        - ctf
        - ctf-admin
      instanceNamespacePrefix: ctf-inst-
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: operator
      - contains:
          path: spec.template.spec.containers[0].args
          content: --namespace
      - contains:
          path: spec.template.spec.containers[0].args
          content: ctf
      - contains:
          path: spec.template.spec.containers[0].args
          content: ctf-admin
      - contains:
          path: spec.template.spec.containers[0].args
          content: --instance-namespace-prefix
      - contains:
          path: spec.template.spec.containers[0].args
          content: ctf-inst-

  - it: applies replica count override
    set:
      operator:
        deployment:
          replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: does not render deployment when operator is disabled
    set:
      operator:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: mounts operator config and sets config path env var
    set:
      registry:
        - endpoint: registry.ctf.rs/ctf
          secretRef:
            name: ctf-registry-creds
            usernameKey: username
            passwordKey: password
        - endpoint: registry.ctf.rs/team
          secretRef:
            name: ctf-registry-team-creds
            usernameKey: username
            passwordKey: password
      storage:
        s3:
          - endpoint: https://s3-a.ctf.rs
            bucket: ctf-bucket-a
            region: us-east-1
            pathStyle: true
            prefix: challenges-a
            secretRef:
              name: ctf-storage-a-creds
              accessKeyIdKey: accessKeyId
              secretAccessKeyKey: secretAccessKey
          - endpoint: https://s3-b.ctf.rs
            bucket: ctf-bucket-b
            region: us-west-2
            pathStyle: false
            prefix: challenges-b
            secretRef:
              name: ctf-storage-b-creds
              accessKeyIdKey: accessKeyId
              secretAccessKeyKey: secretAccessKey
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CTF_OPERATOR_CONFIG_PATH
            value: /etc/ctf-operator/config.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: operator-config
            mountPath: /etc/ctf-operator/config.yaml
            subPath: config.yaml
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: operator-config
            configMap:
              name: RELEASE-NAME-ctf-operator-config
              items:
                - key: config.yaml
                  path: config.yaml

  - it: renders imagePullSecrets when configured
    set:
      operator:
        deployment:
          imagePullSecrets:
            - name: ctf-registry-pull-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: ctf-registry-pull-secret
