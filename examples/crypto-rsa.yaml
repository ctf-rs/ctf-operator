name: crypto-rsa
fullName: RSA Basics
description: |
  You intercepted an RSA-encrypted message along with the public key.
  The key was generated with suspiciously small primes.
  Factor the modulus and decrypt the ciphertext to obtain the flag.
authors:
  - CTF Team
categories:
  - crypto
  - misc
difficulty: easy
tags:
  - rsa
  - factoring
  - public-key
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
