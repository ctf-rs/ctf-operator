[package]
name = "app"
version = "0.1.0"
edition = "2024"
description = "Web application for CTF platform management"
license = "MIT"
repository = "https://github.com/ctf-rs/ctf-operator"
readme = "../README.md"
keywords = ["ctf", "web", "leptos"]
categories = ["web-programming"]

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "Request", "RequestInit", "RequestMode", "Response", "Headers", "Location", "DomTokenList", "console", "EventSource", "MessageEvent"], optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

# Server-only dependencies
anyhow = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
axum = { workspace = true, features = ["macros", "form"], optional = true }
axum-extra = { workspace = true, features = ["cookie"], optional = true }
axum-tracing-opentelemetry = { version = "0.33.1", optional = true }
base64 = { workspace = true, optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
ctf-cli = { path = "../cli", optional = true }
futures = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
http = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
kube = { workspace = true, features = ["client", "runtime"], optional = true }
leptos_axum = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, features = ["ring", "std"], optional = true }
sea-orm = { workspace = true, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"], optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
tokio-stream = { workspace = true, optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
tower = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["env-filter"], optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4", "serde"], optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys", "dep:serde-wasm-bindgen"]
ssr = [
    "leptos/ssr",
    "dep:anyhow",
    "dep:async-stream",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-s3",
    "dep:axum",
    "dep:axum-extra",
    "dep:axum-tracing-opentelemetry",
    "dep:base64",
    "dep:chrono",
    "dep:ctf-cli",
    "dep:futures",
    "dep:hex",
    "dep:hmac",
    "dep:http",
    "dep:k8s-openapi",
    "dep:kube",
    "dep:leptos_axum",
    "dep:rand",
    "dep:reqwest",
    "dep:rustls",
    "dep:sea-orm",
    "dep:sha2",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tower-http",
    "dep:tower",
    "dep:tracing",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:uuid",
]
