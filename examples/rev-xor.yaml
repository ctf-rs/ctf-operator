name: rev-xor
fullName: XOR Cipher
description: |
  The flag has been encrypted with a repeating XOR key before being
  embedded in the binary. Reverse engineer the encryption routine
  to determine the key and decrypt the flag.
authors:
  - CTF Team
categories:
  - rev
difficulty: easy
tags:
  - xor
  - encryption
  - disassembly
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
