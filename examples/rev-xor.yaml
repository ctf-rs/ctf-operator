apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: rev-xor
spec:
  fullName: XOR Cipher
  instancing: false
  description: 'The flag has been encrypted with a repeating XOR key before being

    embedded in the binary. Reverse engineer the encryption routine

    to determine the key and decrypt the flag.

    '
  authors:
  - CTF Team
  categories:
  - rev
  difficulty: easy
  tags:
  - xor
  - encryption
  - disassembly
  flags:
  - name: flag
    label: "Reverse the binary"
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
