suite: service rendering
templates:
  - templates/service.yaml
tests:
  - it: renders a Service
    asserts:
      - isKind:
          of: Service
      - equal:
          path: spec.type
          value: ClusterIP

  - it: uses default ports
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 80
      - equal:
          path: spec.ports[0].targetPort
          value: 8080

  - it: overrides service type and port
    set:
      service:
        type: NodePort
        port: 8080
        targetPort: 3000
    asserts:
      - equal:
          path: spec.type
          value: NodePort
      - equal:
          path: spec.ports[0].port
          value: 8080
      - equal:
          path: spec.ports[0].targetPort
          value: 3000

  - it: has correct selector labels
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: ctf-app
      - equal:
          path: spec.selector["app.kubernetes.io/instance"]
          value: RELEASE-NAME
