apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: pwn-overflow
spec:
  fullName: Buffer Overflow Basics
  instancing: true
  description: 'A simple C program reads user input without bounds checking.

    Overflow the buffer to overwrite the return address and

    redirect execution to the win function that prints the flag.

    '
  authors:
  - CTF Team
  categories:
  - pwn
  difficulty: veryeasy
  tags:
  - buffer-overflow
  - stack
  - beginner
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
