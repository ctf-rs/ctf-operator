apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: misc-sanity
spec:
  fullName: Sanity Check
  description: 'Welcome to the CTF! This is a sanity check challenge to make sure

    your environment is set up correctly. Connect to the service

    and follow the instructions to get your first flag.

    '
  authors:
  - CTF Team
  categories:
  - misc
  difficulty: veryeasy
  tags:
  - sanity
  - welcome
  - beginner
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
