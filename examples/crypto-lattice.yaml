name: crypto-lattice
fullName: Lattice Based Crypto
description: |
  A post-quantum cryptographic scheme based on the Learning With Errors problem
  has been implemented with insufficient noise. Use lattice reduction techniques
  such as LLL or BKZ to break the encryption and recover the flag.
authors:
  - CTF Team
categories:
  - crypto
difficulty: insane
tags:
  - lattice
  - lwe
  - post-quantum
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
