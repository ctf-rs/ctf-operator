apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: crypto-rsa
spec:
  fullName: RSA Basics
  instancing: false
  description: 'You intercepted an RSA-encrypted message along with the public key.

    The key was generated with suspiciously small primes.

    Factor the modulus and decrypt the ciphertext to obtain the flag.

    '
  authors:
  - CTF Team
  categories:
  - crypto
  - misc
  tags:
  - rsa
  - factoring
  - public-key
  flags:
  - name: flag
    label: "Decrypt the message"
    body: fake_flag_value
    difficulty: easy
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
