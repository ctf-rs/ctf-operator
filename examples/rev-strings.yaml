apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: rev-strings
spec:
  fullName: Strings
  instancing: false
  description: 'A binary contains the flag hidden somewhere in its data sections.

    Use basic reverse engineering tools to extract readable strings

    from the executable and find the flag.

    '
  authors:
  - CTF Team
  categories:
  - rev
  difficulty: veryeasy
  tags:
  - strings
  - static-analysis
  - beginner
  flags:
  - name: flag
    label: "Reverse the binary"
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
