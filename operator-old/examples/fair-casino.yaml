apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: fair-casino
  namespace: default
spec:
  parentRef:
    name: playground
    kind: Jeopardy
  fullName: Fair Casino
  description: |
    Our casino is fair, but is it too fair?
  authors:
    - DragonSec SI
  categories:
    - crypto
  tags:
    - scc2025-finals
  flags:
    - name: flag
      body: trutle_and_rabbit_for_the_win
  ports:
    - name: port
      type: nc
  containers:
    - name: fair-casino
      image: registry.ctf.rs/scc2025-finals/crypto-fair-casino:latest
      flags:
        - name: flag
          env: FLAG
      ports:
        - name: shell
          exposePort: port
          containerPort: 1337
