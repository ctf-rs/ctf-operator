apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: foren-disk
spec:
  fullName: Disk Forensics
  instancing: false
  description: 'A disk image from a compromised workstation has been provided.

    Recover deleted files and analyze the filesystem metadata

    to find the flag hidden by the attacker.

    '
  authors:
  - CTF Team
  categories:
  - foren
  tags:
  - disk-image
  - file-recovery
  - ext4
  flags:
  - name: flag
    label: "Analyze the evidence"
    body: fake_flag_value
    difficulty: easy
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
