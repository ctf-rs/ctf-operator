replicaCount: 1

image:
  repository: registry.ctf.rs/ctf/app
  tag: edge
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Single CTF that this app instance serves.
ctf:
  # Kubernetes resource name of the Ctf object.
  name: ""
  # Namespace where the Ctf and its Challenge resources live.
  namespace: ctf
  # Install a Ctf custom resource via this chart.
  install: false
  # --- fields below are only used when ctf.install is true ---
  fullName: ""
  description: ""
  public: true
  instanceDurationSeconds: 900
  challenges: []
  flag:
    prefix: CTF
    format: curly
    random:
      length: 8
    options:
      ignoreRandom: false
  network:
    ip: ""
    ports:
      start: 12000
      end: 13000

instanceNamePrefix: ctf-inst

database:
  url: ""

oauth:
  issuerUrl: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""

session:
  cookieName: ctf_app_session

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
