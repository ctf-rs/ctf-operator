name: rev-strings
fullName: Strings
description: |
  A binary contains the flag hidden somewhere in its data sections.
  Use basic reverse engineering tools to extract readable strings
  from the executable and find the flag.
authors:
  - CTF Team
categories:
  - rev
difficulty: veryeasy
tags:
  - strings
  - static-analysis
  - beginner
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
