{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ctf-operator.configMapName" . }}
  labels:
    app.kubernetes.io/name: {{ include "ctf-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yaml: |
    registry:
{{ toYaml .Values.registry | nindent 6 }}
    storage:
      s3:
{{ toYaml .Values.storage.s3 | nindent 8 }}
    instance:
      deployment:
        replicas: {{ .Values.instance.deployment.replicas }}
{{- if .Values.instance.deployment.imagePullPolicy }}
        imagePullPolicy: {{ .Values.instance.deployment.imagePullPolicy | quote }}
{{- end }}
{{- if .Values.instance.deployment.useHostPort }}
        useHostPort: true
{{- end }}
{{- if .Values.instance.deployment.runtimeClassName }}
        runtimeClassName: {{ .Values.instance.deployment.runtimeClassName | quote }}
{{- end }}
{{- if and .Values.instance.deployment.imagePullSecret .Values.instance.deployment.imagePullSecret.name }}
        imagePullSecret:
          name: {{ .Values.instance.deployment.imagePullSecret.name | quote }}
          namespace: {{ .Values.instance.deployment.imagePullSecret.namespace | default .Release.Namespace | quote }}
{{- end }}
{{- if .Values.instance.deployment.nodeSelector }}
        nodeSelector:
{{ toYaml .Values.instance.deployment.nodeSelector | nindent 10 }}
{{- end }}
      service:
        type: {{ .Values.instance.service.type | quote }}
        nodePortMode: {{ .Values.instance.service.nodePortMode | quote }}
{{- if .Values.instance.service.annotations }}
        annotations:
{{ toYaml .Values.instance.service.annotations | nindent 10 }}
{{- end }}
{{- if .Values.instance.service.labels }}
        labels:
{{ toYaml .Values.instance.service.labels | nindent 10 }}
{{- end }}
{{- if .Values.instance.ciliumNetworkPolicy }}
      ciliumNetworkPolicy:
{{ toYaml .Values.instance.ciliumNetworkPolicy | nindent 8 }}
{{- end }}
{{- end }}
