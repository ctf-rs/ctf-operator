name: crypto-ecc
fullName: Elliptic Curve Cryptography
description: |
  A custom elliptic curve implementation uses non-standard parameters.
  The curve order has a smooth factor that makes it vulnerable to
  Pohlig-Hellman attack. Solve the discrete log to recover the flag.
authors:
  - CTF Team
categories:
  - crypto
difficulty: hard
tags:
  - ecc
  - discrete-log
  - pohlig-hellman
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
