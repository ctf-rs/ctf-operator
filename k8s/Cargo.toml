[package]
name = "ctf-k8s"
version = "0.1.0"
edition = "2021"

[dependencies]
ctf-core = { path = "../core" }
schemars = { version = "1.2.1", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
k8s-openapi = { version = "0.27.1", features = ["schemars", "v1_33"] }
kube = { version = "3.0.1", features = ["client", "derive", "runtime", "unstable-runtime"] }
jiff = "0.2.23"

[dev-dependencies]
