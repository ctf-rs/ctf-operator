apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: flags.operator.ctf.rs
spec:
  group: operator.ctf.rs
  names:
    categories: []
    kind: Flag
    plural: flags
    shortNames:
    - flag
    singular: flag
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Custom resource representing a Flag
        properties:
          spec:
            properties:
              body:
                type: string
              format:
                default: curly
                enum:
                - curly
                - round
                - square
                - angle
                - underscore
                type: string
              options:
                default:
                  ignoreCase: false
                properties:
                  ignoreCase:
                    default: false
                    type: boolean
                type: object
              prefix:
                type: string
              random:
                nullable: true
                properties:
                  concat:
                    maxLength: 1
                    minLength: 1
                    nullable: true
                    type: string
                  digits:
                    default: true
                    type: boolean
                  len:
                    default: 8
                    format: uint8
                    maximum: 255.0
                    minimum: 0.0
                    type: integer
                  lower:
                    default: true
                    type: boolean
                  special:
                    default: ''
                    type: string
                  upper:
                    default: true
                    type: boolean
                type: object
            required:
            - body
            - prefix
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  properties:
                    lastProbeTime:
                      description: Last time an KubeObject was probed for a condition.
                      format: date-time
                      nullable: true
                      type: string
                    lastTransitionTime:
                      description: Last time a condition transitioned from one status to another.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      description: Human readable message that describes details about last transition.
                      nullable: true
                      type: string
                    reason:
                      description: |-
                        Unique one word reason in CamelCase that describes the reason for a
                        transition.
                      nullable: true
                      type: string
                    status:
                      description: |-
                        Status of the condition.
                        Can be True, False, Unknown
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: Type of the condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              flag:
                nullable: true
                type: string
            required:
            - conditions
            type: object
        required:
        - spec
        title: FlagValidated
        type: object
        x-kubernetes-validations:
        - message: Flag prefix is empty
          rule: self.spec.prefix != ''
        - message: Flag prefix can only contain letters and numbers
          rule: self.spec.prefix.matches('^[a-zA-Z0-9]+$')
        - message: Flag prefix must be between 3 and 6 characters long
          rule: size(self.spec.prefix) >= 3 && size(self.spec.prefix) <= 6
        - message: Flag body is empty
          rule: self.spec.body != ''
        - message: Flag body cant be larger than 128 chars
          rule: size(self.spec.body) < 128
        - message: Flag random len must be non-zero
          rule: '!has(self.spec.random) || self.spec.random.len != 0'
        - message: Flag random cant be larger than 64
          rule: '!has(self.spec.random) || self.spec.random.len < 64'
        - message: Flag random cant be larger than 64
          rule: '!has(self.spec.random) || self.spec.random.len < 64'
    served: true
    storage: true
    subresources:
      status: {}
