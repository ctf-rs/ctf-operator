name: Build Image (Docker)
on: [push]

jobs:
  build:
    runs-on: github-actions-ctf-rs

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t my-new-image:v1 \
            -t my-new-image:${{ github.sha }} \
            .
