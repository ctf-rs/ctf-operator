apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: challenges.operator.ctf.rs
spec:
  group: operator.ctf.rs
  names:
    categories: []
    kind: Challenge
    plural: challenges
    shortNames:
    - chall
    singular: challenge
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Custom resource representing a Challenge
        properties:
          spec:
            properties:
              authors:
                default: []
                items:
                  type: string
                type: array
              categories:
                items:
                  enum:
                  - rev
                  - pwn
                  - web
                  - foren
                  - crypto
                  - hw
                  - osint
                  - misc
                  type: string
                type: array
              containers:
                items:
                  properties:
                    flags:
                      items:
                        properties:
                          env:
                            type: string
                          name:
                            type: string
                        required:
                        - env
                        - name
                        type: object
                      type: array
                    image:
                      type: string
                    name:
                      type: string
                    ports:
                      items:
                        properties:
                          containerPort:
                            format: uint16
                            maximum: 65535.0
                            minimum: 0.0
                            type: integer
                          exposePort:
                            nullable: true
                            type: string
                          name:
                            type: string
                        required:
                        - containerPort
                        - name
                        type: object
                      type: array
                  required:
                  - image
                  - name
                  type: object
                type: array
              description:
                nullable: true
                type: string
              flags:
                items:
                  properties:
                    body:
                      type: string
                    format:
                      enum:
                      - curly
                      - round
                      - square
                      - angle
                      - underscore
                      - null
                      nullable: true
                      type: string
                    name:
                      type: string
                    options:
                      default:
                        ignoreCase: false
                      properties:
                        ignoreCase:
                          default: false
                          type: boolean
                      type: object
                    prefix:
                      nullable: true
                      type: string
                    random:
                      nullable: true
                      properties:
                        concat:
                          maxLength: 1
                          minLength: 1
                          nullable: true
                          type: string
                        digits:
                          default: true
                          type: boolean
                        len:
                          default: 8
                          format: uint8
                          maximum: 255.0
                          minimum: 0.0
                          type: integer
                        lower:
                          default: true
                          type: boolean
                        special:
                          default: ''
                          type: string
                        upper:
                          default: true
                          type: boolean
                      type: object
                  required:
                  - body
                  - name
                  type: object
                type: array
              fullName:
                default: ''
                type: string
              parentRef:
                properties:
                  kind:
                    default: Jeopardy
                    enum:
                    - Jeopardy
                    type: string
                  name:
                    type: string
                  namespace:
                    nullable: true
                    type: string
                required:
                - name
                type: object
              ports:
                items:
                  properties:
                    name:
                      type: string
                    type:
                      enum:
                      - http
                      - https
                      - nc
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              tags:
                default: []
                items:
                  type: string
                type: array
            required:
            - categories
            - containers
            - flags
            - parentRef
            - ports
            type: object
          status:
            nullable: true
            properties:
              conditions:
                default: []
                items:
                  properties:
                    lastProbeTime:
                      description: Last time an KubeObject was probed for a condition.
                      format: date-time
                      nullable: true
                      type: string
                    lastTransitionTime:
                      description: Last time a condition transitioned from one status to another.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      description: Human readable message that describes details about last transition.
                      nullable: true
                      type: string
                    reason:
                      description: |-
                        Unique one word reason in CamelCase that describes the reason for a
                        transition.
                      nullable: true
                      type: string
                    status:
                      description: |-
                        Status of the condition.
                        Can be True, False, Unknown
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: Type of the condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - spec
        title: Challenge
        type: object
    served: true
    storage: true
    subresources:
      status: {}
