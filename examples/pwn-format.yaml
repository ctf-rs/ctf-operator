apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: pwn-format
spec:
  fullName: Format String Exploits
  instancing: true
  description: 'The program uses printf with user-controlled format strings.

    Leverage format string vulnerabilities to leak stack data and

    overwrite the GOT entry to hijack control flow and capture the flag.

    '
  authors:
  - CTF Team
  categories:
  - pwn
  - rev
  tags:
  - format-string
  - got-overwrite
  - printf
  flags:
  - name: flag
    label: "Exploit the binary"
    body: fake_flag_value
    difficulty: mid
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
