{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ctf-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ctf-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.operator.deployment.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ctf-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ctf-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.operator.deployment.podAnnotations }}
      annotations:
{{- toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ include "ctf-operator.serviceAccountName" . }}
    {{- with .Values.operator.deployment.imagePullSecrets }}
      imagePullSecrets:
    {{ toYaml . | nindent 8 }}
    {{- end }}
      securityContext:
{{- toYaml .Values.operator.deployment.podSecurityContext | nindent 8 }}
      containers:
        - name: ctf-operator
          image: "{{ .Values.operator.deployment.image.repository }}:{{ .Values.operator.deployment.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.deployment.image.pullPolicy }}
          args:
            - operator
{{- range $namespace := .Values.watchNamespaces }}
            - --namespace
            - {{ $namespace | quote }}
{{- end }}
            - --instance-namespace-prefix
            - {{ .Values.instanceNamespacePrefix | quote }}
          securityContext:
{{- toYaml .Values.operator.deployment.securityContext | nindent 12 }}
          volumeMounts:
            - name: operator-config
              mountPath: /etc/ctf-operator/config.yaml
              subPath: config.yaml
              readOnly: true
          env:
            - name: CTF_OPERATOR_CONFIG_PATH
              value: /etc/ctf-operator/config.yaml
{{- with .Values.operator.deployment.env }}
{{ toYaml . | nindent 12 }}
{{- end }}
          resources:
{{- toYaml .Values.operator.deployment.resources | nindent 12 }}
      volumes:
        - name: operator-config
          configMap:
            name: {{ include "ctf-operator.configMapName" . }}
            items:
              - key: config.yaml
                path: config.yaml
        {{- with .Values.operator.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.operator.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with .Values.operator.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
