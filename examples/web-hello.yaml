apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: web-hello
spec:
  fullName: Hello Web
  instancing: true
  description: 'Welcome to the world of web exploitation!

    This beginner-friendly challenge will introduce you to basic web concepts.

    Can you find the hidden flag on this simple webpage?

    '
  authors:
  - CTF Team
  categories:
  - web
  difficulty: veryeasy
  tags:
  - http
  - html
  - beginner
  flags:
  - name: flag1
    body: fake_flag_value_1
    difficulty: veryeasy
  - name: flag2
    body: fake_flag_value_2
    difficulty: veryeasy
  - name: flag3
    body: fake_flag_value_3
    difficulty: easy
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag1
      env: FLAG1
    - name: flag2
      env: FLAG2
    - name: flag3
      env: FLAG3
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
