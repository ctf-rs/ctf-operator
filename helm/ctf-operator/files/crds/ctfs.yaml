    kind: Ctf
    plural: ctfs
    shortNames: []
    singular: ctf
  scope: Namespaced
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for CtfSpec via `CustomResource`
        properties:
          spec:
            properties:
              challenges:
                items:
                  type: string
                type: array
              conditions:
                default: []
                items:
                  properties:
                    lastProbeTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    lastTransitionTime:
                      description: Time is a wrapper around time.Time which supports correct marshaling to YAML and JSON.  Wrappers are provided for many of the factory methods that the time package offers.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      nullable: true
                      type: string
                    reason:
                      nullable: true
                      type: string
                    status:
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              description:
                nullable: true
                type: string
              flag:
                properties:
                  format:
                    default: curly
                    enum:
                    - curly
                    - round
                    - square
                    - angle
                    - underscore
                    type: string
                  prefix:
                    maxLength: 6
                    minLength: 3
                    pattern: ^[a-zA-Z0-9]+$
                    type: string
                  random:
                    nullable: true
                    properties:
                      digits:
                        default: true
                        type: boolean
                      len:
                        default: 8
                        format: uint8
                        maximum: 63.0
                        minimum: 1.0
                        type: integer
                      lower:
                        default: true
                        type: boolean
                      special:
                        default: ''
