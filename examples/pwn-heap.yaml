apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: pwn-heap
spec:
  fullName: Heap Exploitation
  instancing: true
  description: 'A note-taking application allocates and frees heap chunks carelessly.

    Exploit a use-after-free vulnerability combined with tcache poisoning

    to gain arbitrary write and overwrite a function pointer to get the flag.

    '
  authors:
  - CTF Team
  categories:
  - pwn
  difficulty: hard
  tags:
  - heap
  - use-after-free
  - tcache
  flags:
  - name: flag
    label: "Exploit the binary"
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
