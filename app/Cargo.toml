[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["macros", "form"] }
axum-extra = { workspace = true, features = ["cookie"] }
base64 = { workspace = true }
ctf-cli = { path = "../cli" }
http = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["client", "runtime"] }
leptos = { workspace = true, features = ["ssr"] }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "json"] }
tokio = { workspace = true, features = ["full"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
url = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
