{{- if and .Values.operator.enabled .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ctf-operator.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ctf-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["operator.ctf.rs"]
    resources: ["ctfs", "challenges", "flags", "instances", "portclaims", "reservationsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
  - apiGroups: ["operator.ctf.rs"]
    resources: ["ctfs/status", "challenges/status", "flags/status", "instances/status", "portclaims/status", "reservationsets/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["operator.ctf.rs"]
    resources: ["instances/finalizers"]
    verbs: ["update", "patch"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
{{- end }}
