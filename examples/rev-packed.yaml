apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: rev-packed
spec:
  fullName: Packed Binary
  instancing: false
  description: 'This binary has been compressed with a custom packer that decrypts

    the code at runtime. Unpack the binary to reveal the original logic,

    then analyze the flag validation routine to extract the flag.

    '
  authors:
  - CTF Team
  categories:
  - rev
  difficulty: mid
  tags:
  - packing
  - unpacking
  - dynamic-analysis
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
