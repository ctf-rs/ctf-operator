apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: foren-memory
spec:
  fullName: Memory Forensics
  description: 'A memory dump was taken from a running system suspected of being compromised.

    Use Volatility or similar tools to analyze running processes, extract artifacts,

    and locate the flag that was loaded into memory by the attacker''s payload.

    '
  authors:
  - CTF Team
  categories:
  - foren
  difficulty: mid
  tags:
  - memory-dump
  - volatility
  - process-analysis
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
