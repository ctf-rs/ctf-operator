apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ctf-operator.configMapName" . }}
  labels:
    app.kubernetes.io/name: {{ include "ctf-operator.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.yaml: |
    registry:
{{ toYaml .Values.registry | nindent 6 }}
    storage:
      s3:
{{ toYaml .Values.storage.s3 | nindent 8 }}
