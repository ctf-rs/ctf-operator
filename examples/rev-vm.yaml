name: rev-vm
fullName: Custom VM
description: |
  A custom virtual machine executes bytecode that validates the flag.
  Reverse engineer the VM's instruction set architecture and write
  a disassembler to understand the validation logic and extract the flag.
authors:
  - CTF Team
categories:
  - rev
difficulty: insane
tags:
  - vm
  - bytecode
  - custom-architecture
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
