apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: rev-vm
spec:
  fullName: Custom VM
  instancing: false
  description: 'A custom virtual machine executes bytecode that validates the flag.

    Reverse engineer the VM''s instruction set architecture and write

    a disassembler to understand the validation logic and extract the flag.

    '
  authors:
  - CTF Team
  categories:
  - rev
  difficulty: insane
  tags:
  - vm
  - bytecode
  - custom-architecture
  flags:
  - name: flag
    label: "Reverse the binary"
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
