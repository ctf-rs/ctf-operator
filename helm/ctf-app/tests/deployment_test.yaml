suite: deployment rendering
templates:
  - templates/deployment.yaml
set:
  ctf:
    name: my-ctf
  database:
    url: postgres://localhost/ctf
  oauth:
    issuerUrl: https://auth.example.com
    clientId: ctf-app
    clientSecret: secret
    redirectUrl: https://ctf.example.com/callback
tests:
  - it: renders a Deployment by default
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.replicas
          value: 1

  - it: uses the default image
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "registry.ctf.rs/ctf/app:0.1.0"

  - it: overrides image tag
    set:
      image:
        tag: v1.0.0
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "registry.ctf.rs/ctf/app:v1.0.0"

  - it: applies replica count override
    set:
      replicaCount: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3

  - it: sets required env vars
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            value: "postgres://localhost/ctf"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_ISSUER_URL
            value: "https://auth.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_ID
            value: "ctf-app"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_SECRET
            value: "secret"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_REDIRECT_URL
            value: "https://ctf.example.com/callback"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CTF_NAME
            value: "my-ctf"

  - it: uses database existingSecret
    set:
      database:
        existingSecret: db-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: db-creds
                key: url

  - it: uses database existingSecret with custom key
    set:
      database:
        existingSecret: db-creds
        urlKey: DATABASE_URL
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: db-creds
                key: DATABASE_URL

  - it: uses oauth existingSecret for client secret
    set:
      oauth:
        existingSecret: oauth-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth-creds
                key: clientSecret

  - it: uses oauth existingSecret with custom key
    set:
      oauth:
        existingSecret: oauth-creds
        clientSecretKey: OIDC_CLIENT_SECRET
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OIDC_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                name: oauth-creds
                key: OIDC_CLIENT_SECRET

  - it: sets CTF_NAMESPACE default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CTF_NAMESPACE
            value: "ctf"

  - it: overrides CTF_NAMESPACE
    set:
      ctf:
        namespace: custom-ns
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CTF_NAMESPACE
            value: "custom-ns"

  - it: sets default INSTANCE_NAME_PREFIX
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTANCE_NAME_PREFIX
            value: "ctf-inst"

  - it: overrides INSTANCE_NAME_PREFIX
    set:
      instanceNamePrefix: my-prefix
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTANCE_NAME_PREFIX
            value: "my-prefix"

  - it: sets default SESSION_COOKIE_NAME
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SESSION_COOKIE_NAME
            value: "ctf_app_session"

  - it: omits S3 endpoint when not set
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_ENDPOINT
          any: true

  - it: sets S3 env vars when configured
    set:
      s3:
        endpoint: https://s3.example.com
        pathStyle: true
        region: eu-west-1
        presignTtlSeconds: 300
        accessKeyId: AKID
        secretAccessKey: SKEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_ENDPOINT
            value: "https://s3.example.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_PATH_STYLE
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_REGION
            value: "eu-west-1"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_PRESIGN_TTL_SECONDS
            value: "300"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_ACCESS_KEY_ID
            value: "AKID"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_SECRET_ACCESS_KEY
            value: "SKEY"

  - it: uses S3 existingSecret
    set:
      s3:
        existingSecret: s3-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-creds
                key: accessKeyId
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-creds
                key: secretAccessKey

  - it: uses S3 existingSecret with custom keys
    set:
      s3:
        existingSecret: s3-creds
        accessKeyIdKey: AWS_ACCESS_KEY_ID
        secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: s3-creds
                key: AWS_ACCESS_KEY_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: s3-creds
                key: AWS_SECRET_ACCESS_KEY

  - it: omits S3 credentials when not set
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_ACCESS_KEY_ID
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: CHALLENGE_FILES_S3_SECRET_ACCESS_KEY
          any: true

  - it: omits INSTANCE_BASE_DOMAIN when not set
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTANCE_BASE_DOMAIN
          any: true

  - it: sets INSTANCE_BASE_DOMAIN when configured
    set:
      instanceBaseDomain: ctf.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: INSTANCE_BASE_DOMAIN
            value: "ctf.example.com"

  - it: sets default BEHIND_REVERSE_PROXY to false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BEHIND_REVERSE_PROXY
            value: "false"

  - it: sets BEHIND_REVERSE_PROXY when enabled
    set:
      behindReverseProxy: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: BEHIND_REVERSE_PROXY
            value: "true"

  - it: omits discord env vars when not set
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCORD_LINK_SECRET
          any: true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCORD_BOT_CALLBACK_URL
          any: true

  - it: sets discord env vars when configured
    set:
      discord:
        linkSecret: hmac-secret
        botCallbackUrl: http://bot:3030
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCORD_LINK_SECRET
            value: "hmac-secret"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCORD_BOT_CALLBACK_URL
            value: "http://bot:3030"

  - it: uses discord existingSecret
    set:
      discord:
        existingSecret: discord-creds
        botCallbackUrl: http://bot:3030
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCORD_LINK_SECRET
            valueFrom:
              secretKeyRef:
                name: discord-creds
                key: linkSecret

  - it: uses discord existingSecret with custom key
    set:
      discord:
        existingSecret: discord-creds
        linkSecretKey: HMAC_SECRET
        botCallbackUrl: http://bot:3030
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: DISCORD_LINK_SECRET
            valueFrom:
              secretKeyRef:
                name: discord-creds
                key: HMAC_SECRET

  - it: renders imagePullSecrets when configured
    set:
      imagePullSecrets:
        - name: my-pull-secret
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content:
            name: my-pull-secret

  - it: applies pod annotations
    set:
      podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"

  - it: applies resource limits and requests
    set:
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: applies nodeSelector
    set:
      nodeSelector:
        kubernetes.io/os: linux
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector["kubernetes.io/os"]
          value: linux

  - it: applies tolerations
    set:
      tolerations:
        - key: dedicated
          operator: Equal
          value: ctf
          effect: NoSchedule
    asserts:
      - contains:
          path: spec.template.spec.tolerations
          content:
            key: dedicated
            operator: Equal
            value: ctf
            effect: NoSchedule
