apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: portclaims.operator.ctf.rs
spec:
  group: operator.ctf.rs
  names:
    categories: []
    kind: PortClaim
    plural: portclaims
    shortNames:
    - port
    singular: portclaim
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.port
      name: PORT
      type: integer
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Custom resource representing a PortClaim
        properties:
          spec:
            properties:
              reservation:
                properties:
                  name:
                    type: string
                    x-kubernetes-validations:
                    - message: name field is immutable
                      rule: self == oldSelf
                  namespace:
                    nullable: true
                    type: string
                    x-kubernetes-validations:
                    - message: namespace field is immutable
                      rule: self == oldSelf
                required:
                - name
                type: object
            required:
            - reservation
            type: object
          status:
            nullable: true
            properties:
              conditions:
                items:
                  properties:
                    lastProbeTime:
                      description: Last time an KubeObject was probed for a condition.
                      format: date-time
                      nullable: true
                      type: string
                    lastTransitionTime:
                      description: Last time a condition transitioned from one status to another.
                      format: date-time
                      nullable: true
                      type: string
                    message:
                      description: Human readable message that describes details about last transition.
                      nullable: true
                      type: string
                    reason:
                      description: |-
                        Unique one word reason in CamelCase that describes the reason for a
                        transition.
                      nullable: true
                      type: string
                    status:
                      description: |-
                        Status of the condition.
                        Can be True, False, Unknown
                      enum:
                      - 'True'
                      - 'False'
                      - Unknown
                      type: string
                    type:
                      description: Type of the condition
                      type: string
                  required:
                  - status
                  - type
                  type: object
                type: array
              port:
                format: uint16
                maximum: 65535.0
                minimum: 0.0
                nullable: true
                type: integer
            required:
            - conditions
            type: object
        required:
        - spec
        title: PortClaimValidated
        type: object
        x-kubernetes-validations:
        - message: reservation field is immutable
          rule: self.spec.reservation == oldSelf.spec.reservation
    selectableFields:
    - jsonPath: .spec.reservation.name
    - jsonPath: .spec.reservation.namespace
    served: true
    storage: true
    subresources:
      status: {}
