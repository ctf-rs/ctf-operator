apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: rev-obfuscated
spec:
  fullName: Obfuscated Code
  instancing: false
  description: 'A heavily obfuscated JavaScript application validates user input

    against a hidden flag. Control flow flattening and string encryption

    make static analysis difficult. Deobfuscate the code to find the flag.

    '
  authors:
  - CTF Team
  categories:
  - rev
  tags:
  - obfuscation
  - javascript
  - deobfuscation
  flags:
  - name: flag
    label: "Reverse the binary"
    body: fake_flag_value
    difficulty: hard
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
