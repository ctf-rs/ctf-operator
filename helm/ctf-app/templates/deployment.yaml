apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ctf-app.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ctf-app.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ctf-app.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ctf-app.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
{{- with .Values.podAnnotations }}
      annotations:
{{- toYaml . | nindent 8 }}
{{- end }}
    spec:
      serviceAccountName: {{ include "ctf-app.fullname" . }}
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{- toYaml . | nindent 8 }}
{{- end }}
      containers:
        - name: ctf-app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_BIND_ADDR
              value: 0.0.0.0:8080
            - name: DATABASE_URL
            {{- if .Values.database.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.urlKey | default "url" }}
            {{- else }}
              value: {{ required "database.url is required when database.existingSecret is not set" .Values.database.url | quote }}
            {{- end }}
            - name: OIDC_ISSUER_URL
              value: {{ required "oauth.issuerUrl is required" .Values.oauth.issuerUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "oauth.clientId is required" .Values.oauth.clientId | quote }}
            - name: OIDC_CLIENT_SECRET
            {{- if .Values.oauth.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth.existingSecret }}
                  key: {{ .Values.oauth.clientSecretKey | default "clientSecret" }}
            {{- else }}
              value: {{ required "oauth.clientSecret is required when oauth.existingSecret is not set" .Values.oauth.clientSecret | quote }}
            {{- end }}
            - name: OIDC_REDIRECT_URL
              value: {{ required "oauth.redirectUrl is required" .Values.oauth.redirectUrl | quote }}
            - name: CTF_NAME
              value: {{ required "ctf.name is required" .Values.ctf.name | quote }}
            - name: CTF_NAMESPACE
              value: {{ .Values.ctf.namespace | default "ctf" | quote }}
            - name: INSTANCE_NAME_PREFIX
              value: {{ .Values.instanceNamePrefix | default "ctf-inst" | quote }}
            - name: MAX_INSTANCES_PER_USER
              value: {{ .Values.maxInstancesPerUser | default 2 | quote }}
            - name: SESSION_COOKIE_NAME
              value: {{ .Values.session.cookieName | default "ctf_app_session" | quote }}
            {{- if .Values.s3.endpoint }}
            - name: CHALLENGE_FILES_S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            {{- end }}
            - name: CHALLENGE_FILES_S3_PATH_STYLE
              value: {{ .Values.s3.pathStyle | default true | quote }}
            - name: CHALLENGE_FILES_S3_REGION
              value: {{ .Values.s3.region | default "us-east-1" | quote }}
            - name: CHALLENGE_FILES_PRESIGN_TTL_SECONDS
              value: {{ .Values.s3.presignTtlSeconds | default 600 | quote }}
            {{- if or .Values.s3.accessKeyId .Values.s3.existingSecret }}
            - name: CHALLENGE_FILES_S3_ACCESS_KEY_ID
            {{- if .Values.s3.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKeyIdKey | default "accessKeyId" }}
            {{- else }}
              value: {{ .Values.s3.accessKeyId | quote }}
            {{- end }}
            {{- end }}
            {{- if or .Values.s3.secretAccessKey .Values.s3.existingSecret }}
            - name: CHALLENGE_FILES_S3_SECRET_ACCESS_KEY
            {{- if .Values.s3.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretAccessKeyKey | default "secretAccessKey" }}
            {{- else }}
              value: {{ .Values.s3.secretAccessKey | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.instanceBaseDomain }}
            - name: INSTANCE_BASE_DOMAIN
              value: {{ .Values.instanceBaseDomain | quote }}
            {{- end }}
            - name: BEHIND_REVERSE_PROXY
              value: {{ .Values.behindReverseProxy | default false | quote }}
            {{- if .Values.oauth.playerRole }}
            - name: OIDC_PLAYER_ROLE
              value: {{ .Values.oauth.playerRole | quote }}
            {{- end }}
            {{- if .Values.oauth.adminRole }}
            - name: OIDC_ADMIN_ROLE
              value: {{ .Values.oauth.adminRole | quote }}
            {{- end }}
            {{- if or .Values.discord.linkSecret .Values.discord.existingSecret }}
            - name: DISCORD_LINK_SECRET
            {{- if .Values.discord.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.discord.existingSecret }}
                  key: {{ .Values.discord.linkSecretKey | default "linkSecret" }}
            {{- else }}
              value: {{ .Values.discord.linkSecret | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.discord.botCallbackUrl }}
            - name: DISCORD_BOT_CALLBACK_URL
              value: {{ .Values.discord.botCallbackUrl | quote }}
            {{- end }}
          resources:
{{- toYaml .Values.resources | nindent 12 }}
{{- with .Values.nodeSelector }}
      nodeSelector:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.affinity }}
      affinity:
{{- toYaml . | nindent 8 }}
{{- end }}
{{- with .Values.tolerations }}
      tolerations:
{{- toYaml . | nindent 8 }}
{{- end }}
