[package]
name = "ctf-k8s"
version = "0.1.0"
edition = "2021"

[dependencies]
ctf-core = { path = "../core" }
schemars = { workspace = true, features = ["uuid1"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
k8s-openapi = { workspace = true, features = ["schemars", "v1_33"] }
kube = { workspace = true, features = ["client", "derive", "runtime", "unstable-runtime"] }
jiff = { workspace = true }

[dev-dependencies]
