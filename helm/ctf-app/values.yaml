replicaCount: 1

image:
  repository: registry.ctf.rs/ctf/app
  # tag defaults to .Chart.AppVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

# Single CTF that this app instance serves.
ctf:
  # Kubernetes resource name of the Ctf object.
  name: ""
  # Namespace where the Ctf and its Challenge resources live.
  namespace: ctf
  # Install a Ctf custom resource via this chart.
  install: false
  # --- fields below are only used when ctf.install is true ---
  fullName: ""
  description: ""
  public: true
  instanceDurationSeconds: 900
  challenges: []
  flag:
    prefix: CTF
    format: curly
    random:
      length: 8
    options:
      ignoreRandom: false
  network:
    ip: ""
    ports:
      start: 12000
      end: 13000
  scoreboard: {}
  schedule: {}

instanceNamePrefix: ctf-inst

# Maximum number of simultaneously spawned instances per user.
maxInstancesPerUser: 2

# Maximum number of simultaneously spawned instances per team.
# Defaults to maxInstancesPerUser when not set.
maxInstancesPerTeam: ""

# Application mode: "user" (default) or "team".
# In team mode only users with a team can submit flags and spawn instances.
appMode: "user"

database:
  url: ""
  # Use an existing Secret instead of a plain-text url.
  existingSecret: ""
  urlKey: url

oauth:
  issuerUrl: ""
  clientId: ""
  clientSecret: ""
  redirectUrl: ""
  # Use an existing Secret for clientSecret.
  existingSecret: ""
  clientSecretKey: clientSecret
  # OIDC role name that grants player (competitor) access to non-public CTFs.
  playerRole: ""
  # OIDC role name that grants admin access. Admin submissions are excluded
  # from the scoreboard.
  adminRole: "scc2026-quals/admin"

session:
  cookieName: ctf_app_session

# S3-compatible storage for challenge file downloads.
s3:
  endpoint: ""
  pathStyle: true
  region: us-east-1
  presignTtlSeconds: 600
  accessKeyId: ""
  secretAccessKey: ""
  # Use an existing Secret for S3 credentials.
  existingSecret: ""
  accessKeyIdKey: accessKeyId
  secretAccessKeyKey: secretAccessKey

# Base domain for instance connections (e.g. "ctf.example.com").
instanceBaseDomain: ""

# Whether the app sits behind a reverse proxy (trust X-Forwarded-For).
behindReverseProxy: false

# Discord bot integration.
discord:
  linkSecret: ""
  botCallbackUrl: ""
  # Use an existing Secret for linkSecret.
  existingSecret: ""
  linkSecretKey: linkSecret

# OpenTelemetry OTLP exporter configuration.
otel:
  # Set to true to inject OTEL_EXPORTER_OTLP_ENDPOINT into the pod.
  enabled: false
  # gRPC endpoint of the OTLP collector (e.g. Alloy).
  endpoint: "http://alloy.monitoring.svc:4317"
  # Value for OTEL_SERVICE_NAME (defaults to "ctf-app").
  serviceName: "ctf-app"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

podAnnotations: {}
nodeSelector: {}
affinity: {}
tolerations: []
