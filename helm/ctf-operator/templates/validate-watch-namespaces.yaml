{{- if or (not .Values.watchNamespaces) (eq (len .Values.watchNamespaces) 0) }}
{{- fail "watchNamespaces cannot be empty; set at least one namespace" }}
{{- end }}
{{- range $ns := .Values.watchNamespaces }}
{{- if eq (trim $ns) "" }}
{{- fail "watchNamespaces cannot contain empty namespace values" }}
{{- end }}
{{- end }}
