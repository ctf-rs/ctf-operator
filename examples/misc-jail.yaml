apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: misc-jail
spec:
  fullName: Python Jail
  description: 'You have access to a restricted Python interpreter that blocks most

    builtins and imports. Escape the sandbox by finding creative ways

    to access forbidden functions and read the flag from the filesystem.

    '
  authors:
  - CTF Team
  categories:
  - misc
  difficulty: mid
  tags:
  - python
  - sandbox-escape
  - jail
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
