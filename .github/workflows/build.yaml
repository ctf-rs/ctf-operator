name: Build Image (Docker)
on: [push]

jobs:
  build:
    runs-on: github-actions-ctf-rs

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=registry.ctf.rs/docker-hub/moby/buildkit:master
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["registry.ctf.rs/docker-hub"]

      - name: Build Docker image
        run: |
          docker build \
            -t my-new-image:v1 \
            -t my-new-image:${{ github.sha }} \
            .
