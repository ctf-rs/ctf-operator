services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ctf
      POSTGRES_DB: ctf_app
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf_app"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./dev/keycloak-realm.json:/opt/keycloak/data/import/ctf-realm.json:ro
    ports:
      - "8081:8081"

  garage:
    image: dxflrs/garage:v1.3.1
    volumes:
      - ./dev/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3903:3903"

  lgtm:
    image: grafana/otel-lgtm:0.10.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./dev/grafana/provisioning/dashboards:/otel-lgtm/grafana/conf/provisioning/dashboards:ro
      - ./dev/grafana/provisioning/datasources/postgres.yaml:/otel-lgtm/grafana/conf/provisioning/datasources/postgres.yaml:ro
      - ./dev/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

volumes:
  pg_data:
  garage_data: