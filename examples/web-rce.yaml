apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: web-rce
spec:
  fullName: Remote Code Execution
  instancing: true
  description: 'A file upload service seems to have robust validation, but appearances

    can be deceiving. Chain multiple vulnerabilities together to achieve

    remote code execution on the server and read the flag from the filesystem.

    '
  authors:
  - CTF Team
  categories:
  - web
  difficulty: insane
  tags:
  - rce
  - file-upload
  - exploitation
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
