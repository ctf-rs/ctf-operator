apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: misc-blockchain
spec:
  fullName: Blockchain
  instancing: true
  description: 'A vulnerable smart contract has been deployed on a local testnet.

    Analyze the Solidity source code to find the reentrancy vulnerability

    and drain the contract''s funds to trigger the flag release mechanism.

    '
  authors:
  - CTF Team
  categories:
  - misc
  - crypto
  tags:
  - blockchain
  - solidity
  - smart-contract
  flags:
  - name: flag
    label: "Solve the puzzle"
    body: fake_flag_value
    difficulty: hard
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
