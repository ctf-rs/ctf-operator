installCRDs: true

operator:
  enabled: true
  deployment:
    replicaCount: 1
    image:
      repository: registry.ctf.rs/ctf/operator
      # tag defaults to .Chart.AppVersion
      tag: ""
      pullPolicy: IfNotPresent
    imagePullSecrets: []
      # Example:
      # - name: ctf-registry-pull-secret
    env: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      fsGroup: 65532
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

nameOverride: ""
fullnameOverride: ""

watchNamespaces:
  - ctf

instanceNamespacePrefix: ctf-inst-

registry: []
  # Example:
  # - endpoint: registry.ctf.rs/ctf
  #   secretRef:
  #     name: ctf-registry-creds
  #     usernameKey: username
  #     passwordKey: password

storage:
  s3: []
    # Example:
    # - endpoint: https://s3.ctf.rs
    #   bucket: ctf-bucket
    #   region: us-east-1
    #   pathStyle: true
    #   prefix: challenges
    #   secretRef:
    #     name: ctf-storage-creds
    #     accessKeyIdKey: accessKeyId
    #     secretAccessKeyKey: secretAccessKey

instance:
  deployment:
    replicas: 1
    imagePullPolicy: ""
    # Secret to copy into instance namespaces for pulling challenge images.
    # Specify the name and source namespace of the Secret.
    imagePullSecret: {}
      # name: ctf-registry-creds
      # namespace: ctf-operator
  service:
    type: ClusterIP
    nodePortMode: Auto
  # CiliumNetworkPolicy spec to create in each instance namespace.
  # The operator will create a CiliumNetworkPolicy resource with this spec.
  ciliumNetworkPolicy: {}
    # Example:
    # endpointSelector:
    #   matchLabels:
    #     role: instance
    # ingress:
    #   - fromEndpoints:
    #       - matchLabels:
    #           role: gateway

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true
