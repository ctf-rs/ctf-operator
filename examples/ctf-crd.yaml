apiVersion: operator.ctf.rs/v1alpha1
kind: Ctf
metadata:
  name: playground
spec:
  fullName: Playground
  public: true
  flag:
    prefix: SCC
    format: curly
    random:
      len: 8
    options:
      ignoreRandom: false
  network:
    ports:
      start: 12000
      end: 12020
  challenges:
    - challenge-test
    - crypto-aes
    - crypto-caesar
    - crypto-ecc
    - crypto-lattice
    - crypto-rsa
    - foren-disk
    - foren-malware
    - foren-memory
    - foren-pcap
    - foren-stego
    - misc-blockchain
    - misc-jail
    - misc-quantum
    - misc-sanity
    - misc-trivia
    - pwn-format
    - pwn-heap
    - pwn-kernel
    - pwn-overflow
    - pwn-rop
    - rev-obfuscated
    - rev-packed
    - rev-strings
    - rev-vm
    - rev-xor
    - web-foren-combo
    - web-hello
    - web-rce
    - web-sqli
    - web-ssrf
    - web-xss
