[package]
name = "ctf-operator"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive", "env", "std"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["ansi", "env-filter"] }
once_cell = "1.21.3"
regex = "1.12.3"
parking_lot = "0.12.5"
async-stream = "0.3.6"
jiff = "0.2.23"

k8s-openapi = { version = "0.27.1", features = ["schemars", "v1_33"] }
kube = { version = "3.0.1", features = ["client", "derive", "runtime", "unstable-runtime"] }

ctf-core = { path = "../core" }
ctf-k8s = { path = "../k8s" }
