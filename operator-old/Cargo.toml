[package]
name = "ctf-operator"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
telemetry = ["opentelemetry-otlp"]

[dependencies]
anyhow = "1.0.102"
cfg-if = "1.0.4"
clap = { version = "4.5.60", features = ["derive", "env", "std"] }
parking_lot = "0.12.5"
thiserror = "2.0.18"
schemars = { version = "1.2.1", features = ["uuid1"] }
jiff = "0.2.23"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde-saphyr = "0.0.27"
futures = "0.3.32"
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }

k8s-openapi = { version = "0.27.1", features = ["schemars", "v1_33"] }
kube = { version = "4.0.0", features = ["client", "derive", "runtime", "unstable-runtime"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["ansi", "env-filter"] }
tracing-opentelemetry = "0.33.0"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", optional = true, default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
prometheus-client = "0.24.0"
rand = "0.10.0"
ahash = "0.8.12"
stream-broadcast = "0.3.0"
async-stream = "0.3.6"
nameof = "1.3.0"
regex = "1.12.3"
once_cell = "1.21.3"
uuid = { version = "1.22.0", features = ["serde", "v4"] }
