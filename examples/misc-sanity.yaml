name: misc-sanity
fullName: Sanity Check
description: |
  Welcome to the CTF! This is a sanity check challenge to make sure
  your environment is set up correctly. Connect to the service
  and follow the instructions to get your first flag.
authors:
  - CTF Team
categories:
  - misc
difficulty: veryeasy
tags:
  - sanity
  - welcome
  - beginner
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
