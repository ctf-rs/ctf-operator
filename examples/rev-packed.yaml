name: rev-packed
fullName: Packed Binary
description: |
  This binary has been compressed with a custom packer that decrypts
  the code at runtime. Unpack the binary to reveal the original logic,
  then analyze the flag validation routine to extract the flag.
authors:
  - CTF Team
categories:
  - rev
difficulty: mid
tags:
  - packing
  - unpacking
  - dynamic-analysis
flags:
  - name: flag
    body: fake_flag_value
containers:
  - name: test
    image:
      type: dockerfile
      path: challenge-test/Dockerfile
    flags:
      - name: flag
        env: FLAG
    ports:
      - name: socat
        type: netcat
        expose: true
        containerPort: 1337
