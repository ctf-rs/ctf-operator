# Example values for the ctf-operator Helm chart.
# Install with:
#   helm install ctf-operator helm/ctf-operator -f examples/helm-ctf-operator-values.yaml

installCRDs: true

operator:
  enabled: true
  deployment:
    replicaCount: 1
    image:
      repository: registry.ctf.rs/ctf/operator
      tag: latest
      pullPolicy: IfNotPresent
    imagePullSecrets:
      - name: ctf-registry-pull-secret
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

watchNamespaces:
  - ctf

instanceNamespacePrefix: ctf-inst-

registry:
  - endpoint: registry.ctf.rs/ctf
    secretRef:
      name: ctf-registry-creds
      usernameKey: username
      passwordKey: password

storage:
  s3:
    - endpoint: https://s3.ctf.rs
      bucket: ctf-challenges
      region: us-east-1
      pathStyle: true
      prefix: challenges
      secretRef:
        name: ctf-storage-creds
        accessKeyIdKey: accessKeyId
        secretAccessKeyKey: secretAccessKey

instance:
  deployment:
    replicas: 1
    imagePullPolicy: IfNotPresent
  service:
    type: ClusterIP
    nodePortMode: Auto

serviceAccount:
  create: true

rbac:
  create: true
