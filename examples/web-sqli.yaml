apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: web-sqli
spec:
  fullName: SQL Injection 101
  instancing: true
  description: 'A classic login form stands between you and the flag.

    The developer forgot to sanitize user inputs.

    Use SQL injection techniques to bypass authentication and retrieve the flag.

    '
  authors:
  - CTF Team
  categories:
  - web
  - foren
  difficulty: easy
  tags:
  - sql
  - injection
  - authentication
  flags:
  - name: flag-user
    label: "Stage User"
    body: fake_flag_user
    difficulty: easy
  - name: flag-admin
    label: "Stage Admin"
    body: fake_flag_admin
    difficulty: easy
    random:
      len: 6
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag-user
      env: FLAG_USER
    - name: flag-admin
      env: FLAG_ADMIN
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
