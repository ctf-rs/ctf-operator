[package]
name = "ctf-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.102"
garde = { version = "0.22.1", features = ["serde", "derive", "regex"] }
rand = "0.10.0"
schemars = { version = "1.2.1", features = ["uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.50.0", features = ["full"] }
