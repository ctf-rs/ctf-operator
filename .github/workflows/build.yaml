name: Build Image using Containerfile
on: [push]

jobs:
  build:
    name: Build image
    runs-on: github-actions-ctf-rs
    container:
      image: ghcr.io/actions/runner-images/ubuntu24:latest

    steps:
      - uses: actions/checkout@v4

      - name: Buildah Action
        uses: redhat-actions/buildah-build@v2
        with:
          image: my-new-image
          tags: v1 ${{ github.sha }}
          containerfiles: |
            ./Containerfile
          build-args: |
            some_arg=some_value
