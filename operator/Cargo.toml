[package]
name = "ctf-operator"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive", "env", "std"] }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-saphyr = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter"] }
once_cell = { workspace = true }
regex = { workspace = true }
parking_lot = { workspace = true }
async-stream = { workspace = true }
jiff = { workspace = true }

k8s-openapi = { workspace = true, features = ["schemars", "v1_33"] }
kube = { workspace = true, features = ["client", "derive", "runtime", "unstable-runtime"] }
rustls = { workspace = true, default-features = false, features = ["ring", "std"] }

ctf-cli = { path = "../cli" }
