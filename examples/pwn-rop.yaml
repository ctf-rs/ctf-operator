apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: pwn-rop
spec:
  fullName: Return Oriented Programming
  instancing: true
  description: 'NX is enabled and you can no longer execute shellcode on the stack.

    Build a ROP chain using gadgets found in the binary to call system("/bin/sh")

    and read the flag from the filesystem.

    '
  authors:
  - CTF Team
  categories:
  - pwn
  tags:
  - rop
  - gadgets
  - nx
  flags:
  - name: flag
    label: "Exploit the binary"
    body: fake_flag_value
    difficulty: easy
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
