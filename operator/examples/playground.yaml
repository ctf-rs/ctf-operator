apiVersion: operator.ctf.rs/v1alpha1
kind: Jeopardy
metadata:
  name: playground
  namespace: default
spec:
  fullName: CyberHero Playground
  flag:
    prefix: SCC
    random:
      len: 8
      concat: +
  expose:
    reservation:
      start: 10000
      end: 11000
    serviceTemplate:
      type: LoadBalancer
      labels:
        advertise: bgp-ip
      annotations:
        io.cilium/lb-ipam-ips: 10.4.10.1
        lbipam.cilium.io/sharing-key: ctf-playground
        lbipam.cilium.io/sharing-cross-namespace: "*"
