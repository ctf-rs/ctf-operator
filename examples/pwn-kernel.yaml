apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: pwn-kernel
spec:
  fullName: Kernel Pwn
  instancing: true
  description: 'A custom kernel module contains a vulnerability in its ioctl handler.

    Exploit the race condition to escalate privileges from an unprivileged

    user to root and read the flag stored in /root/flag.txt.

    '
  authors:
  - CTF Team
  categories:
  - pwn
  difficulty: insane
  tags:
  - kernel
  - privilege-escalation
  - race-condition
  flags:
  - name: flag
    label: "Exploit the binary"
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
