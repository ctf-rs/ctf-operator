apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: misc-quantum
spec:
  fullName: Quantum Computing
  instancing: true
  description: 'A quantum key distribution protocol has a flaw in its implementation.

    Exploit the weakness in the BB84 protocol simulation to intercept

    the quantum key exchange and decrypt the flag without being detected.

    '
  authors:
  - CTF Team
  categories:
  - misc
  difficulty: insane
  tags:
  - quantum
  - qkd
  - simulation
  flags:
  - name: flag
    body: fake_flag_value
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag
      env: FLAG
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
