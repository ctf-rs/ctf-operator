[package]
name = "controller"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive", "env", "std"] }
k8s-openapi = { version = "0.24.0", features = ["schemars", "v1_30"] }
kube = { version = "0.99.0", features = ["client", "derive", "runtime"] }
kubert = { version = "0.24.0", features = ["index", "lease", "clap", "runtime"] }
parking_lot = "0.12.5"
schemars = "0.8.22"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_yaml = "0.9.34"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["ansi", "env-filter"] }
