[package]
name = "ctf-operator"
version = "0.1.0"
edition = "2024"

[features]
default = ["telemetry"]
telemetry = ["opentelemetry-otlp"]

[dependencies]
anyhow = "1.0.100"
cfg-if = "1.0.4"
clap = { version = "4.5.54", features = ["derive", "env", "std"] }
parking_lot = "0.12.5"
thiserror = "2.0.17"
schemars = "1.2.0"
jiff = "0.2.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34-deprecated"
futures = "0.3.31"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }

k8s-openapi = { version = "0.27.0", features = ["schemars", "v1_33"] }
kube = { version = "3.0.0", features = ["client", "derive", "runtime"] }

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["ansi", "env-filter"] }
tracing-opentelemetry = "0.32.1"
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry-otlp = { version = "0.31.0", optional = true, default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
prometheus-client = "0.24.0"