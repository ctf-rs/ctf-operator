[workspace]
resolver = "2"
members = ["app", "bot", "cli", "operator"]

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
# missing_docs = "warn"  # Enable before release
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

# Allow our special-purpose nonstandard cfg attributes.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(coverage,coverage_nightly)',
] }

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Lints from the `restriction` group that are not enabled by categories above but are still useful.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
multiple_unsafe_ops_per_block = "warn"
panic = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
unwrap_used = "warn"
#
# Below are undesirable lint rules that are enabled by the categories above but are not useful.
#

# This lint in many cases produces less readable code and is not worth the trouble.
option_if_let_else = "allow"
# Just because a fn can be const does not mean it should be const. Const is a promise, part of the
# API contract, and removing it is a breaking change so we need to be careful where we commit to const.
missing_const_for_fn = "allow"
# This sometimes prevents marking crate-scoped items as pub(crate), so is not welcome.
redundant_pub_crate = "allow"
# Testing panic messages is not universally applicable - panic messages are not an API contract.
should_panic_without_expect = "allow"
# This just misfires a lot and claims we can drop values that actually need to remain borrowed.
# It also often results in much less readable code for no benefit.
significant_drop_tightening = "allow"
# Blocked by Clippy bug: https://github.com/rust-lang/rust-clippy/issues/15036
wildcard_imports = "allow"
# In a large workspace, duplicate dependencies are inevitable; this lint causes more maintenance burden than practical benefit.
multiple_crate_versions = "allow"
missing_errors_doc = "allow"

# [workspace.lints.rustdoc]
# missing_crate_level_docs = "warn"
# unescaped_backticks = "warn"

[[workspace.metadata.leptos]]
name = "app"
bin-package = "app"
lib-package = "app"
output-name = "app"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:8090"
reload-port = 3001
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
env = "DEV"

[workspace.dependencies]
anyhow = "1.0.102"
async-stream = "0.3.6"
axum = "0.8.8"
axum-extra = "0.12.5"
aws-config = "1.8.8"
aws-credential-types = "1.2.8"
aws-sdk-s3 = "1.81.0"
base64 = "0.22.1"
clap = "4.5.60"
futures = "0.3.32"
garde = "0.23.0"
hex = "0.4"
hmac = "0.13"
http = "1.3.1"
jiff = "0.2.23"
k8s-openapi = { version = "0.29.0", features = ["schemars", "v1_33"] }
kube = "3.0.1"
leptos = "0.8.17"
leptos_axum = "0.8.8"
once_cell = "1.21.3"
parking_lot = "0.12.5"
rand = "0.10.0"
regex = "1.12.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls", "form"] }
rustls = { version = "0.23.36", default-features = false }
schemars = "1.2.1"
serde = "1.0.228"
serde-saphyr = "0.0.27"
serde_json = "1.0.149"
sha2 = "0.11"
sea-orm = { version = "2.0.0-rc", default-features = false }
sqlx = "0.9.0"
thiserror = "2.0.18"
tokio = "1.50.0"
tower = "0.5.2"
tokio-stream = "0.1.17"
opentelemetry = "0.32.0"
opentelemetry_sdk = { version = "0.32.0", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "metrics", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = "0.3.22"
url = "2.5.7"
urlencoding = "2.1.3"
uuid = "1.18.1"
wasm-bindgen = "0.2"
