apiVersion: operator.ctf.rs/v1alpha1
kind: Challenge
metadata:
  name: crypto-aes
spec:
  fullName: AES Challenge
  instancing: false
  description: 'An encryption oracle allows you to encrypt arbitrary plaintexts using
    AES-CBC.

    The initialization vector is reused across sessions. Exploit this weakness

    to perform a chosen-plaintext attack and recover the secret flag.

    '
  authors:
  - CTF Team
  categories:
  - crypto
  difficulty: mid
  tags:
  - aes
  - cbc
  - chosen-plaintext
  flags:
  - name: flag-a
    label: "Stage A"
    body: fake_flag_a
    difficulty: mid
  - name: flag-b
    label: "Stage B"
    body: fake_flag_b
    difficulty: mid
  containers:
  - name: test
    image: nginx:alpine
    flags:
    - name: flag-a
      env: FLAG_A
    - name: flag-b
      env: FLAG_B
    ports:
    - name: socat
      type: http
      expose: true
      containerPort: 80
