[package]
name = "ctf-cli"
version = "0.1.0"
edition = "2021"
default-run = "ctf"
description = "CLI tools for CTF challenge management and Kubernetes resource generation"
license = "MIT"
repository = "https://github.com/ctf-rs/ctf-operator"
readme = "../README.md"
keywords = ["ctf", "kubernetes", "operator", "cli"]
categories = ["command-line-utilities", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "ctf"
path = "src/main.rs"

[lib]
name = "ctf_cli"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
serde-saphyr = { workspace = true }
aws-config = { workspace = true }
aws-credential-types = { workspace = true }
aws-sdk-s3 = { workspace = true }
garde = { workspace = true, features = ["serde", "derive", "regex"] }
rand = { workspace = true }
schemars = { workspace = true, features = ["uuid1"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
k8s-openapi = { workspace = true }
kube = { workspace = true, features = ["client", "derive", "runtime", "unstable-runtime"] }
jiff = { workspace = true }
